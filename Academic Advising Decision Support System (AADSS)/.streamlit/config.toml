[theme]
base = "light"
primaryColor = "#0b4f89"
backgroundColor = "#f5f7fb"
secondaryBackgroundColor = "#eaf0f7"
textColor = "#142c49"
font = "sans serif"
baseRadius = "0.6rem"
borderColor = "#dde5ee"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0b2f57"
secondaryBackgroundColor = "#14406f"
textColor = "#eef3f9"
primaryColor = "#e3b94b"
borderColor = "#2a5583"

[server]
headless = true
address = "127.0.0.1"
[browser]
gatherUsageStats = false
